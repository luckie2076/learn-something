<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>04 · 表格</title></head>
<body>
  <table border="1">
    <caption>学生成绩表</caption>
    <thead>
      <tr><th>姓名</th><th>数学</th><th>英语</th></tr>
    </thead>
    <tbody>
      <tr><td>小明</td><td>90</td><td>85</td></tr>
      <tr><td>小红</td><td colspan="2">缺考</td></tr>
      <!-- colspan 跨 2 列 -->
    </tbody>
  </table>
  <!-- 现代布局多用 CSS Grid/Flex，表格应只用于“表格数据”，不要用来排版 -->
</body>
</html>
