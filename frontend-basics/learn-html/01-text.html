<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>01 · 文本与排版</title></head>
<body>
  <!-- 标题：h1~h6 表示层级，h1 最重要。用标题而非大字号 <div> 才是“语义化” -->
  <h1>一级标题（页面主标题，通常每页只有 1 个 h1）</h1>
  <h2>二级标题</h2>
  <h3>三级标题</h3>

  <p>这是一个段落。<strong>加粗</strong>表示重要，<em>斜体</em>表示强调语气。</p>
  <p>换行用 <code>&lt;br&gt;</code>。<br>这一行换到下一行。</p>
  <hr>
  <!-- <hr> 是“主题分隔线”，语义上是“内容转换”，不要只为了画一条线而用 -->

  <blockquote>引用一段话，通常缩进显示。</blockquote>

  <pre>保留空格和换行的预格式化文本
    像这样对齐</pre>

  <p>行内代码用 <code>const x = 1</code>，小字说明用 <small>脚注</small>。</p>
</body>
</html>
