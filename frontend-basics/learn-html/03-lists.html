<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>03 · 列表</title></head>
<body>
  <h2>无序列表 ul</h2>
  <ul>
    <li>苹果</li>
    <li>香蕉</li>
  </ul>

  <h2>有序列表 ol</h2>
  <ol>
    <li>第一步</li>
    <li>第二步</li>
  </ol>

  <h2>定义列表 dl（术语 + 解释）</h2>
  <dl>
    <dt>HTML</dt><dd>超文本标记语言</dd>
    <dt>CSS</dt><dd>层叠样式表</dd>
  </dl>

  <!-- 列表可以嵌套，用来表示层级 -->
  <ul>
    <li>前端
      <ul><li>HTML</li><li>CSS</li></ul>
    </li>
  </ul>
</body>
</html>
