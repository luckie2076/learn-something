<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>07 · align-self</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 40px 20px; color: #333; line-height: 1.8; }
    a.back { color: #7c4dff; text-decoration: none; font-size: 14px; }
    h1 { font-size: 24px; margin: 12px 0 8px; }
    .desc { color: #888; margin-bottom: 20px; }

    .section { margin-bottom: 36px; }
    .section h2 { font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .section h2 code { background: #eee; padding: 2px 8px; border-radius: 3px; font-size: 14px; color: #7c4dff; }

    .demo { border: 2px dashed #ccc; border-radius: 8px; padding: 12px; display: flex; gap: 8px; min-height: 140px; align-items: flex-start; }
    .item { background: #b39ddb; color: #fff; text-align: center; padding: 12px 20px; border-radius: 6px; font-weight: 600; min-width: 80px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 返回目录</a>
  <h1>align-self — 单个子项独立对齐</h1>
  <p class="desc"><code>align-self</code> 允许单个子项覆盖容器的 <code>align-items</code> 设置，实现个别对齐。</p>

  <div class="section">
    <h2>容器 <code>align-items: flex-start</code>，个别子项用 <code>align-self</code> 覆盖</h2>
    <div class="demo" style="align-items:flex-start;">
      <div class="item">默认（顶部）</div>
      <div class="item" style="align-self:center;">居中</div>
      <div class="item" style="align-self:flex-end;">底部</div>
      <div class="item" style="align-self:stretch;">拉伸</div>
    </div>
    <p style="font-size:13px;color:#888;margin-top:6px;">每个子项可以有自己的交叉轴对齐方式</p>
  </div>

  <div class="section">
    <h2>实际场景：卡片操作栏按钮对齐</h2>
    <div style="display:flex; gap:16px; flex-wrap:wrap;">
      <!-- 卡片 -->
      <div style="display:flex; flex-direction:column; width:200px; border:1px solid #e0e0e0; border-radius:8px; padding:16px; gap:12px;">
        <h3 style="font-size:15px;">卡片 A</h3>
        <p style="font-size:13px;color:#888;flex:1;">描述文字很短</p>
        <button style="align-self:flex-end; padding:6px 16px; background:#7c4dff; color:#fff; border:none; border-radius:6px; cursor:pointer;">操作</button>
      </div>
      <!-- 卡片 -->
      <div style="display:flex; flex-direction:column; width:200px; border:1px solid #e0e0e0; border-radius:8px; padding:16px; gap:12px;">
        <h3 style="font-size:15px;">卡片 B</h3>
        <p style="font-size:13px;color:#888;flex:1;">描述文字比较长，需要多行来展示内容并且占满剩余空间</p>
        <button style="align-self:flex-end; padding:6px 16px; background:#7c4dff; color:#fff; border:none; border-radius:6px; cursor:pointer;">操作</button>
      </div>
    </div>
    <p style="font-size:13px;color:#888;margin-top:8px;">卡片用 <code>flex-direction: column</code>，按钮用 <code>align-self: flex-end</code> 始终靠右，不受描述长度影响</p>
  </div>
</body>
</html>
