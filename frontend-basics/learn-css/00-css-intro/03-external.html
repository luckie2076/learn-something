<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>00-03 · 练习：外部样式表</title>

  <!--
    方式 3 · 外部样式表：用 <link> 引入一个独立的 .css 文件。
    推荐用于正式项目——样式与结构彻底分离。
  -->
  <link rel="stylesheet" href="03-styles.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 40px 20px; color: #333; line-height: 1.8; }
    a.back { color: #7c4dff; text-decoration: none; font-size: 14px; }
    h1 { font-size: 24px; margin: 12px 0 16px; }
    .tip { background: #e8f5e9; border-left: 4px solid #4caf50; padding: 12px 16px; border-radius: 4px; margin: 24px 0; font-size: 14px; }
    .nav { margin-top: 24px; font-size: 14px; display: flex; gap: 16px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← 返回总览</a>
  <h1>外部样式表 — &lt;link&gt; 引入 .css 文件</h1>

  <div class="card">卡片（样式来自外部 03-styles.css）</div>
  <p class="muted">说明文字（同样来自外部文件）</p>

  <!--
    为什么这是生产环境首选？
      · 复用：一个 .css 可统一样式全站所有页面；
      · 缓存：.css 被浏览器缓存，后续页面不再重复下载，加载更快；
      · 单一真相源：改一个文件，全站生效；HTML 只管语义，CSS 只管表现。
    提示：用本地服务器打开本文件（python3 -m http.server），
    否则 file:// 下部分浏览器会拦截对 .css 的请求。
  -->
  <div class="tip">
    <strong>外部样式表的生产优势</strong><br/>
    ✅ 多页面复用，全站统一管理<br/>
    ✅ 浏览器缓存，加快二次加载<br/>
    ✅ 符合「关注点分离」原则<br/>
    ✅ 可配合构建工具（PostCSS / Sass）进一步优化
  </div>

  <div class="nav">
    <a href="02-internal.html">← 上一项：内部样式表</a>
  </div>
</body>
</html>
